events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}